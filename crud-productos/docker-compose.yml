services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: escuela_app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    volumes:
      - .:/var/www/html
      - vendor-data:/var/www/html/vendor
      - build-data:/var/www/html/public/build
    networks:
      - escuela_net

  webserver:
    image: nginx:1.27-alpine
    container_name: escuela_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - build-data:/var/www/html/public/build
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - escuela_net

networks:
  escuela_net:
    driver: bridge

volumes:
  vendor-data:
  build-data:
