services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: escuela_app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
    volumes:
      - .:/var/www/html
      - vendor-data:/var/www/html/vendor
      - build-data:/var/www/html/public/build
    depends_on:
      db:
        condition: service_healthy
    networks:
      - escuela_net

  webserver:
    image: nginx:1.27-alpine
    container_name: escuela_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - build-data:/var/www/html/public/build
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - escuela_net

  db:
    image: mysql:8.0
    container_name: escuela_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change_me_root}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-change_me_root}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - escuela_net

networks:
  escuela_net:
    driver: bridge

volumes:
  mysql-data:
  vendor-data:
  build-data:
